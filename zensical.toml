# The Learner Modeling Dashboard's docs, published as a section of docs.inviteai.org.
#
# InviteInstitute/docs builds that site with its own theme, and reads the nav below for this
# section. This file is for checking the pages here:
#
#   zensical serve            # http://localhost:4000, reloads as you edit
#   zensical build --strict   # what the docs bot runs; fails on a broken link or anchor

[project]
site_name = "Learner Modeling Dashboard"
site_description = "A live board that shows which students in a VEX coding class need help right now."
site_url = "https://docs.inviteai.org/lm-dashboard/"
docs_dir = "docs"
dev_addr = "localhost:4000"
repo_url = "https://github.com/InviteInstitute/lm-dashboard"
repo_name = "InviteInstitute/lm-dashboard"

nav = [
  { "Overview" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Concepts" = [
    { "Architecture" = "concepts/architecture.md" },
    { "Write Path (The Daemon)" = "concepts/write-path.md" },
    { "Read Path And Dashboard" = "concepts/read-path.md" },
    { "Data Model" = "concepts/data-model.md" },
    { "Reflecks And ZANY" = "concepts/sources.md" },
  ] },
  { "Guides" = [
    { "Using The Dashboard" = "guides/using-the-dashboard.md" },
    { "Configuration" = "guides/configuration.md" },
    { "Development" = "guides/development.md" },
    { "Running The Tests" = "guides/testing.md" },
  ] },
  { "Reference" = [
    { "API Reference" = "reference/api.md" },
  ] },
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
# GitHub's heading anchors, the same as docs.inviteai.org.
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true

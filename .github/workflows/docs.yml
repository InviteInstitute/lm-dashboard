name: Docs

# After every push to main, the docs bot brings the docs in step with the code
# (docs/guides/development.md#the-docs). The bot itself is docs-bot.yml, shared with zany,
# atlas-invite and agent, and .github/docs-bot.toml holds this repo's settings.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the docs commit to main

jobs:
  docs:
    uses: ./.github/workflows/docs-bot.yml
    secrets:
      LUMEN_API_KEY: ${{ secrets.LUMEN_API_KEY }}

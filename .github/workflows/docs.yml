name: Docs

# After every push to main, bring the docs in step with the code and publish them.
# scripts/docs_sync.py asks an LLM on NCSA's Lumen to fix the pages the push made wrong,
# in the writing style of Maharsh17/claude-config. Its changes go to the docs-sync branch and
# are merged into main once the site builds with --strict, and the site goes to GitHub Pages.
# The org doesn't let Actions open pull requests, so the merge uses GitHub's merge API.
# Run it from the Actions tab to check every page against the whole codebase.
# docs/guides/development.md#the-docs has the details.
#
# A push made with this job's own token starts no workflow, so the merge below never starts
# this job again.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One run at a time, in order. The docs-synced tag marks the last commit the docs were
# checked against, so a run that GitHub skips while another is busy loses no change.
concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: write # push docs-sync, merge it, move the docs-synced tag and push gh-pages

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: Maharsh17/claude-config
          path: .claude-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material

      - name: Bring the docs in step with the code
        env:
          LUMEN_API_KEY: ${{ secrets.LUMEN_API_KEY }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          base=$(git rev-parse -q --verify refs/tags/docs-synced || true)
          if [ "$MANUAL" = true ] || [ -z "$base" ]; then
            python scripts/docs_sync.py --style .claude-config --head "$GITHUB_SHA"
          else
            python scripts/docs_sync.py --style .claude-config --base "$base" --head "$GITHUB_SHA"
          fi

      - name: Check the site builds
        run: mkdocs build --strict

      - name: Merge the docs into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- docs README.md mkdocs.yml)" ]; then
            echo "The docs are current."
            exit 0
          fi
          git switch -C docs-sync
          git add -- docs README.md mkdocs.yml
          git commit -m "Bring the docs in step with ${GITHUB_SHA::7}"
          git push --force origin docs-sync
          gh api "repos/$GITHUB_REPOSITORY/merges" -f base=main -f head=docs-sync \
            -f commit_message="Merge the docs for ${GITHUB_SHA::7}" --silent
          git push origin --delete docs-sync

      - name: Mark the commit the docs are in step with
        run: |
          git tag -f docs-synced "$GITHUB_SHA"
          git push -f origin refs/tags/docs-synced

      - name: Publish the site
        run: mkdocs gh-deploy --force

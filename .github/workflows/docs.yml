name: Docs

# After every push to main, bring the docs in step with the code and publish them.
# scripts/docs_sync.py sends an LLM on NCSA's Lumen the push's diff, the code and the docs,
# with the writing rules of Maharsh17/claude-config, and writes the pages it fixes. If the
# site still builds with `zensical build --strict`, the job commits them to main and
# publishes the site to the gh-pages branch, which GitHub Pages serves.
# docs/guides/development.md#the-docs has the details.
#
# A push made with this job's own token starts no workflow, so its commit never starts this
# job again.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the docs commit to main and the site to gh-pages

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: Maharsh17/claude-config
          path: .claude-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zensical==0.1.3 ghp-import # zensical: the version in pyproject.toml
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bring the docs in step with the push
        env:
          LUMEN_API_KEY: ${{ secrets.LUMEN_API_KEY }}
        run: >-
          python scripts/docs_sync.py --style .claude-config
          --base "${{ github.event.before }}" --head "$GITHUB_SHA"

      - name: Check the site builds
        run: zensical build --strict

      - name: Commit the docs to main
        run: |
          if [ -z "$(git status --porcelain -- docs README.md zensical.toml)" ]; then
            echo "The docs are current."
            exit 0
          fi
          git add -- docs README.md zensical.toml
          git commit -m "Bring the docs in step with ${GITHUB_SHA::7}"
          # main may have moved while the model worked. A docs-only commit rebases cleanly.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish the site
        run: ghp-import --no-jekyll --push --force site

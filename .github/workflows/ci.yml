name: CI

# Lint, format-check, and test the backend and frontend on every push to main
# and every pull request. Mirrors the same workflow in vex-agent-integration.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lmdash
          POSTGRES_PASSWORD: lmdash
          POSTGRES_DB: lm_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates its schema on the fly (db.init_db), so no migration step.
      DATABASE_URL: postgresql://lmdash:lmdash@localhost:5432/lm_dashboard_test
      TEST_DATABASE_URL: postgresql://lmdash:lmdash@localhost:5432/lm_dashboard_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # The trigger/learner-model engine is the agent-lm-packages submodule.
        run: pip install -e ./vendor/agent-lm-packages && pip install -e '.[dev]' ruff==0.16.2

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
